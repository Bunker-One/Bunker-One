name: Contract deadline alerts

on:
  schedule:
    # Every day at 10:42 UTC = 07:42 in Sao Paulo
    - cron: '42 10 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check deadlines and send emails
        run: node alerts/send-alerts.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          APP_URL: https://bunker-one.github.io/contract-register/
